[project]
name = "collection-letter-navigator"
version = "0.1.0"
description = "Streamlit chatbot that explains German debt collection letters and court payment orders in English"
readme = "README.md"
authors = [
    { name = "ijaeg", email = "ijaeg@protonmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "holidays>=0.106",
    "langchain>=1.4.6",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.11",
    "langchain-openai>=1.7.2",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "streamlit>=1.66.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=collection_letter_navigator --cov-report=term-missing"
