  - "194-218"   # limitation
  - "247"       # base rate
  - "266"       # no right to pay in instalments
  - "280"       # damages for breach of duty
  - "286-288"   # default and default interest
  - "362"       # performance discharges the debt
  - "368"       # receipt

ZPO:
  - "222"        # counting of periods
  - "338-339"    # Einspruch and its period
  - "688-703d"   # summary payment procedure

RDG:
  - "2"          # what counts as a legal service (collection is one)
  - "10"         # collection services need a registration
  - "13a-13b"    # information duties towards private persons and consumers
  - "13e-13f"    # reimbursable collection costs; agency plus lawyer
  - "16"         # content of the public register of legal service providers