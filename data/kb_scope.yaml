# Knowledge-base scope: the provisions that are indexed (FR-04 AC1).
#
# Structure: law code -> list of entries. An entry is one section label ("247")
# or an inclusive range ("688-703d"); ranges are resolved in document order, so
# lettered sections (703a, 703b, ...) are included automatically.
# Only the laws listed in config.KB_LAWS are allowed.

BGB:
